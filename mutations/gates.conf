# Mutation spec for tool_objectfs (fork guards) — run with
# `mdl mutate moodle-tool_objectfs-503 mutations/gates.conf --fast` (and again with --db mariadb).
#
# Each line breaks ONE guard and names the test that must go red because of it: a guard whose
# mutation reddens nothing is held by no test, whatever its comment says. Run --dry-run first.
#
#     tag | file relative to the repo | perl script relative to this file

# --- P9: size check before the local unlink (classes/local/store/object_file_system.php) ---
# Accept any external size: a foreign or truncated object at the key deletes the only good copy.
P9_external_size_ignored   | classes/local/store/object_file_system.php | p9_external_size_ignored.pl
#   -> test_delete_object_from_local_by_hash_keeps_local_when_external_size_differs

# Ignore the size recorded in tool_objectfs_objects.
P9_recorded_size_ignored   | classes/local/store/object_file_system.php | p9_recorded_size_ignored.pl
#   -> test_delete_object_from_local_by_hash_compares_the_recorded_size

# --- P10: orphan grace counts from the orphaning (classes/local/manager.php, task) ---
# Never restamp: an object duplicated long ago is removed on the run after it is orphaned.
P10_no_restamp             | classes/local/manager.php | p10_no_restamp.pl
#   -> test_orphaning_restamps_timeduplicated_and_grace_counts_from_it

# Restamp on every upsert: an already orphaned row never ages out.
P10_restamp_always         | classes/local/manager.php | p10_restamp_always.pl
#   -> test_reorphaning_keeps_the_original_orphaning_time

# Drop the {files} anti-join of the metadata-only branch.
P10_metadata_antijoin      | classes/task/delete_orphaned_object_metadata.php | p10_metadata_antijoin.pl
#   -> test_metadata_branch_spares_a_row_with_a_files_row

# --- P11: reconcile_filedir minimum age floor ---
P11_no_age_floor           | classes/task/reconcile_filedir.php | p11_no_age_floor.pl
#   -> test_reconcile_filedir_keeps_fresh_file_when_minorphanedage_is_zero

# --- P12: range-request failure keeps the signature out of the message ---
P12_signed_url_leaks       | classes/local/store/s3/client.php | p12_signed_url_leaks.pl
#   -> test_proxy_range_request_failure_does_not_expose_the_signed_query

# --- P13: Bootstrap 5 badge classes ---
P13_bs4_badge              | classes/task/update_object_tags.php | p13_bs4_badge.pl
#   -> test_get_status_badge

# --- P14: upstream #693, full deletion mode also removes expired orphans remotely ---
P14_full_mode_skips_remote | classes/task/delete_orphaned_object_metadata.php | p14_full_mode_skips_remote.pl
#   -> test_full_mode_removes_the_remote_object_of_an_expired_orphan

# --- P16: Google Cloud Storage store (classes/local/store/gcs/client.php) ---
# A canned ACL on the multipart path: uniform bucket-level access rejects large uploads.
P16_acl_private            | classes/local/store/gcs/client.php | p16_acl_private.pl
#   -> test_multipart_upload_sends_no_acl_and_no_checksums

# Keep the null ACL on the single PUT: the SDK sends it as an empty x-amz-acl header.
P16_acl_unset_dropped      | classes/local/store/gcs/client.php | p16_acl_unset_dropped.pl
#   -> test_upload_sends_a_plain_put_to_the_path_style_xml_endpoint

# Back to the SDK's flexible checksums, which Cloud Storage does not document.
P16_sdk_checksums          | classes/local/store/gcs/client.php | p16_sdk_checksums.pl
#   -> test_upload_sends_a_plain_put_to_the_path_style_xml_endpoint

# Virtual-hosted addressing: dotted bucket names become unreachable.
P16_virtual_hosted         | classes/local/store/gcs/client.php | p16_virtual_hosted.pl
#   -> test_upload_sends_a_plain_put_to_the_path_style_xml_endpoint

# Existence instead of content: a foreign object at the key lets the deleter remove the only good copy.
P16_verify_existence_only  | classes/local/store/gcs/client.php | p16_verify_existence_only.pl
#   -> test_verify_object_compares_the_reported_digests

# An object reporting no digest verifies.
P16_verify_no_digest_passes | classes/local/store/gcs/client.php | p16_verify_no_digest_passes.pl
#   -> test_verify_object_compares_the_reported_digests

# Any 404 passes the connection test, a missing bucket included.
P16_connection_any_404     | classes/local/store/gcs/client.php | p16_connection_any_404.pl
#   -> test_test_connection

# Tagging reported supported on a store that has none (audit A10).
P16_tagging_supported      | classes/local/store/gcs/client.php | p16_tagging_supported.pl
#   -> test_tagging_is_reported_unsupported

# A full 200 answer is proxied as if it were the requested range.
P16_range_status_unchecked | classes/local/store/gcs/client.php | p16_range_status_unchecked.pl
#   -> test_get_object_range_rejects_a_full_response

# --- P16, stage G2: keyless authentication and V4 signed URLs ---
# No bearer token: every OAuth-mode request goes out unauthenticated.
P16_bearer_missing         | classes/local/store/gcs/client.php | p16_bearer_missing.pl
#   -> test_oauth_requests_carry_the_bearer_token

# A G1 site with an HMAC key and no mode would switch to the metadata server on upgrade.
P16_authmode_default_metadata | classes/local/store/gcs/client.php | p16_authmode_default_metadata.pl
#   -> test_get_authmode

# The signature cache ignores the response headers: one user's filename is served to another.
P16_signedurl_cache_ignores_headers | classes/local/store/gcs/client.php | p16_signedurl_cache_ignores_headers.pl
#   -> test_signblob_signatures_are_cached_per_object_and_headers

# Unsorted canonical query: Cloud Storage rejects the signature.
P16_v4_query_unsorted      | classes/local/store/gcs/signing/v4_signer.php | p16_v4_query_unsorted.pl
#   -> test_prepare_matches_the_conformance_vectors

# Object names unencoded in the canonical path.
P16_v4_path_unencoded      | classes/local/store/gcs/signing/v4_signer.php | p16_v4_path_unencoded.pl
#   -> test_object_name_segments_are_encoded_separately

# Core's raw UTF-8 file name signed into the URL.
P16_disposition_raw        | classes/local/store/gcs/client.php | p16_disposition_raw.pl
#   -> test_oauth_signed_url_is_v4_by_the_service_account

# A token is kept past its refresh margin.
P16_token_never_refreshed  | classes/local/store/gcs/auth/cached_token_provider.php | p16_token_never_refreshed.pl
#   -> test_token_near_expiry_is_refetched

# Any JSON with an email and a key is taken for a service-account key file.
P16_keyfile_type_unchecked | classes/local/store/gcs/auth/keyfile_token_provider.php | p16_keyfile_type_unchecked.pl
#   -> test_unusable_file_fails_on_use

# A token failure escapes the connection test instead of being reported.
P16_connection_token_failure | classes/local/store/gcs/client.php | p16_connection_token_failure.pl
#   -> test_connection_reports_a_token_failure

# Tokens cached per instance only: every web request fetches one.
P16_token_cache_unshared   | classes/local/store/gcs/auth/cached_token_provider.php | p16_token_cache_unshared.pl
#   -> test_token_is_fetched_once_and_shared

# --- P16, stage G2: findings of the security read of the G2 diff ---
# Google's explanation (which can name the service account) back in the shown message.
P16_remote_error_shown     | classes/local/store/gcs/auth/cached_token_provider.php | p16_remote_error_shown.pl
#   -> test_error_answer_throws

# A cached signature returned past the expiry the caller asked for.
P16_signedurl_cache_outlives_request | classes/local/store/gcs/client.php | p16_signedurl_cache_outlives_request.pl
#   -> test_signblob_signature_never_outlives_the_requested_expiry

# Any email in the signBlob request path.
P16_signblob_email_unchecked | classes/local/store/gcs/signing/iam_blob_signer.php | p16_signblob_email_unchecked.pl
#   -> test_email_outside_address_characters_is_refused

# A file name that is not UTF-8 makes the /u fallback null.
P16_disposition_invalid_utf8 | classes/local/store/gcs/client.php | p16_disposition_invalid_utf8.pl
#   -> test_normalise_content_disposition
