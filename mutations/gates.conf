# Mutation spec for tool_objectfs (fork guards) — run with
# `mdl mutate moodle-tool_objectfs-503 mutations/gates.conf --fast` (and again with --db mariadb).
#
# Each line breaks ONE guard and names the test that must go red because of it: a guard whose
# mutation reddens nothing is held by no test, whatever its comment says. Run --dry-run first.
#
#     tag | file relative to the repo | perl script relative to this file

# --- P9: size check before the local unlink (classes/local/store/object_file_system.php) ---
# Accept any external size: a foreign or truncated object at the key deletes the only good copy.
P9_external_size_ignored   | classes/local/store/object_file_system.php | p9_external_size_ignored.pl
#   -> test_delete_object_from_local_by_hash_keeps_local_when_external_size_differs

# Ignore the size recorded in tool_objectfs_objects.
P9_recorded_size_ignored   | classes/local/store/object_file_system.php | p9_recorded_size_ignored.pl
#   -> test_delete_object_from_local_by_hash_compares_the_recorded_size

# --- P10: orphan grace counts from the orphaning (classes/local/manager.php, task) ---
# Never restamp: an object duplicated long ago is removed on the run after it is orphaned.
P10_no_restamp             | classes/local/manager.php | p10_no_restamp.pl
#   -> test_orphaning_restamps_timeduplicated_and_grace_counts_from_it

# Restamp on every upsert: an already orphaned row never ages out.
P10_restamp_always         | classes/local/manager.php | p10_restamp_always.pl
#   -> test_reorphaning_keeps_the_original_orphaning_time

# Drop the {files} anti-join of the metadata-only branch.
P10_metadata_antijoin      | classes/task/delete_orphaned_object_metadata.php | p10_metadata_antijoin.pl
#   -> test_metadata_branch_spares_a_row_with_a_files_row

# --- P11: reconcile_filedir minimum age floor ---
P11_no_age_floor           | classes/task/reconcile_filedir.php | p11_no_age_floor.pl
#   -> test_reconcile_filedir_keeps_fresh_file_when_minorphanedage_is_zero

# --- P12: range-request failure keeps the signature out of the message ---
P12_signed_url_leaks       | classes/local/store/s3/client.php | p12_signed_url_leaks.pl
#   -> test_proxy_range_request_failure_does_not_expose_the_signed_query

# --- P13: Bootstrap 5 badge classes ---
P13_bs4_badge              | classes/task/update_object_tags.php | p13_bs4_badge.pl
#   -> test_get_status_badge

# --- P14: upstream #693, full deletion mode also removes expired orphans remotely ---
P14_full_mode_skips_remote | classes/task/delete_orphaned_object_metadata.php | p14_full_mode_skips_remote.pl
#   -> test_full_mode_removes_the_remote_object_of_an_expired_orphan
